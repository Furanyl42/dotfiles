# Activer le support True Color (24-bit) dans tmux
set -g default-terminal "tmux-256color"

# Ajouter le support True Color pour xterm-256color ET xterm-kitty
set -ag terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB"

# Transmettre les sous-lignages ondulés (undercurls) de Kitty vers Neovim
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[38:2::%p1%1:%p2%1:%p3%1m'

# Activer le support de la souris (redimensionner les splits, scroller)
set -g mouse on

# Diminuer le délai de la touche Echap (essentiel pour la réactivité de Neovim/Vim)
set -s escape-time 10

# Définir l'index des fenêtres à partir de 1 au lieu de 0
set -g base-index 1
setw -g pane-base-index 1

unbind C-b
set -g prefix M-e
bind M-e send-prefix

# --- Style de la barre de statut et des onglets ---

# Style Flèches Powerline
set -g status-position bottom
set -g status-style "bg=#1f2335,fg=#7aa2f7"

# Onglet actif
set -g window-status-current-format "#[fg=#1f2335,bg=#7aa2f7] #[fg=#15161e,bold]#I  #W #[fg=#7aa2f7,bg=#1f2335]"

# Onglet inactif
set -g window-status-format "#[fg=#565f89] #I  #W "

set -g window-status-separator ""

# Use Vim keys in copy mode
set-window-option -g mode-keys vi

# Use 'v' to begin selection (like Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use 'y' to copy to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy" # Use "xclip -selection clipboard" on Linux

# Open new panes in the current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Open new windows in the current working directory (optional)
bind c new-window -c "#{pane_current_path}"
